# Target-Conditional DRO for Imbalanced Regression
# Default configuration — matches paper Section 5 (Experimental Setup)

dataset:
  name: abalone
  path: data/
  test_ratio: 0.15
  val_ratio: 0.15
  random_seed: 42

dro:
  ambiguity_type: tc-chi2  # tc-chi2 | tc-wasserstein
  radius_base: 0.1
  density_exponent: 0.5
  num_bins: 10
  weight_clip: 10.0
  # Truncation bound M on the per-sample squared residual used by the dual
  # and by the weighted backward pass (targets are standardized).
  loss_clip: 9.0

model:
  architecture: mlp
  hidden_dims: [256, 256, 256, 256]
  dropout: 0.1
  activation: relu

training:
  epochs: 200
  batch_size: 64
  lr: 1.0e-3
  weight_decay: 1.0e-5
  optimizer: adam
  patience: 20

# Baseline-specific hyperparameter grids (searched via val SERA)
baseline_grids:
  lds_fds:
    sigma: [1.0, 2.0, 4.0]
    kernel_size: [3, 5, 7]
    fds_feature_dim: 256
    fds_bins: 100
  dense_loss:
    bandwidth: [silverman, scott]
  conr:
    temperature: [0.05, 0.07, 0.1]
    conr_weight: [0.05, 0.1, 0.2]
    threshold: [0.5, 1.0, 2.0]

evaluation:
  metrics:
    - mse
    - mae
    - sera
    - tail_mse
    - tail_mae
    - coverage_at_quantile
  rare_threshold_percentiles: [5, 10, 25]
